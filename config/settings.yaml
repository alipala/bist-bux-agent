# ==========================================================
#  Genel ayarlar. Ticker eklemek/cikarmak icin burayi duzenle.
# ==========================================================
timezone: "Europe/Istanbul"

browser:
  profile_dir: ".browser_profile"   # kalici oturum (cerez+localStorage) burada
  headless: false                   # login'li kaynaklar icin false onerilir
  slow_mo_ms: 80                    # insan hizina yaklastirir, anti-bot dostu
  nav_timeout_ms: 45000
  locale: "tr-TR"
  viewport: { width: 1440, height: 900 }
  # null birakirsan Playwright'in varsayilan UA'si kullanilir
  user_agent: null

# ==========================================================
#  RITIM — gunun kosulari. Hangi kip ne zaman, ne toplar,
#  panel calistirir mi, kime gider.
#
#  SAAT BURADA YOK: launchd plist'i tek dogruluk kaynagi ve
#  bekci (bot/watchdog.py) onu okuyor. Buraya saat yazmak
#  ikinci bir kaynak acardi ve kacinilmaz olarak ayrisirdi.
#
#  KIP ADI plist etiketinin son parcasiyla AYNI olmali:
#  com.alipala.finagent.<kip>. Test bunu zorluyor.
#
#  VARSAYILAN YOK: bilinmeyen kip ValueError, eksik alan
#  ValueError, bos alici listesi ValueError. Sessizce "nabiz"
#  kabul etmek, yanlis kipin kosmasi demektir.
# ==========================================================
ritim:
  kipler:
    sabah:
      # Gece ABD/Asya kapanislari + kripto (7/24) + TUIK.
      # Kripto GUNLUK BARI 00:00 UTC'de kapaniyor: 22:15 kosusunda
      # BTC'nin o gunku bari HENUZ YOK (olculdu 2026-08-19, son bar
      # 18 Agu'da kalmisti). Sabah kosusu onu yakalayan tek kip.
      # SIRA ONEMLI: `binance` MAKRO'DAN ONCE.
      # `makro`, ALTIN_GRAM'i veritabanindaki PAXG serisinden TURETIYOR
      # (collectors/makro.py: `fiyat_serisi(vekil_id, 400)`). Once
      # kosarsa DUNKU PAXG barini okur ve gram altin bir gun geride
      # kalir — olculdu 2026-08-20: ALTIN_GRAM son bar 18 Agu, diger 15
      # MAKRO serisi 19 Agu'daydi. Ozet mesajindaki makro satiri tam bu
      # kodu gosteriyor, yani bayatlik dogrudan kullaniciya yansiyordu.
      kaynaklar: [prices, binance, makro, tuik]
      panel: true
      panel_butce_sn: 900
      # OLCULDU 2026-08-20, ZINCIR GERCEKTEN KOSTURULARAK:
      #   toplama                              61 sn
      #   + tuik EN KOTU HALI (azami_sure_sn) +300 sn   (olcumde taze
      #     oldugu icin 3,4 sn surdu; ust sinir yazildi)
      #   + panel 2 sahip x 282 sn            +564 sn
      #   = 922 sn  ->  x1,5 = 1383  ->  1500
      kabuk_butce_sn: 1500
      alicilar: [ali, yuksel]
    ogle:
      # Avrupa + BIST seans ortasi, ABD pre-market.
      # `binance` MAKRO'DAN ONCE — gerekce sabah kipinde.
      kaynaklar: [kap, binance, makro, news]
      panel: true
      # 600 DEGIL 900: panel sahip basina olculen 282 sn. 600 iki
      # sahibi ancak yetistiriyor, ucuncude sessizce atlardi.
      panel_butce_sn: 900
      # OLCULDU 2026-08-20: toplama 58 sn + panel 564 sn = 622 sn
      #   ->  x1,5 = 933  ->  1200
      kabuk_butce_sn: 1200
      alicilar: [ali, yuksel]
    kapanis:
      # Euronext 17:30 ve BIST 17:00 (Amsterdam saati) kapandi,
      # ABD acik. `isyatirim` burada: BIST gununun kapanisi.
      kaynaklar: [isyatirim, midas, prices, makro, takvim, kap]
      panel: true
      panel_butce_sn: 900
      # OLCULDU 2026-08-20: toplama 844 sn (isyatirim kendi 780 sn'lik
      #   ic butcesini doldurup `partial` dondu — beklenen davranis)
      #   + panel 564 sn = 1408 sn  ->  x1,5 = 2112  ->  2400
      kabuk_butce_sn: 2400
      alicilar: [ali, yuksel]
    nabiz:
      # ABD kapandi — gunun en yogun bilgi ani. Tam zincir.
      # `tuik` BILEREK YOK: 2026-08-19'da tek basina 20,4 dk yedi ve
      # bu kosu SIGTERM ile olduruldu (bkz. sources.tuik).
      # `bistgecmis` isyatirim'den SONRA: ikisi de BIST yaziyor ama ayri
      # kaynak adlariyla, ve derin seri gunluk tazelemede yalnizca son
      # birkac barla guncelleniyor (ilk kosu 87 sn, sonrakiler ~11 sn).
      kaynaklar: [kriptoevren, kripto, binance, cgfiyat, coingecko,
                  alphavantage, isyatirim, bistgecmis, midas, edgar, xbrl,
                  prices, makro, takvim, news, stocknews, kap, midasbilanco]
      panel: true
      panel_butce_sn: 1800
      # OLCULDU 2026-08-20, 17 collector TEK cagride (tarayici bir kez
      #   aciliyor): toplama 1374 sn + panel 564 sn = 1938 sn
      #   ->  x1,5 = 2907  ->  3000
      # Karsilastirma: 19 Agustos'ta ayni zincir tuik ILE 2632 sn'ydi ve
      # 2700 sn'lik butceyi patlatti. tuik cikinca 1374'e indi.
      kabuk_butce_sn: 3000
      alicilar: [ali, yuksel]

  # OZET MESAJINDA GORUNECEK MAKRO KODLARI. Bos liste = satir yok.
  # Kodlar `instruments` icinde venue='MAKRO' olarak duruyor; para
  # birimi de oradan okunur, ELLE YAZILMAZ.
  ozet_makro: [ALTIN_GRAM, BRENT, USDTRY]

watchlist:
  # BIST'te takip edilen semboller (isyatirim + KAP + haber eslestirmesi icin)
  # --- KRIPTO ---------------------------------------------------------
  # Ucu de PUBLIC: anahtar yok, oturum yok, giris yok (2026-08-15 olculdu).
  # Portfoy BAKIYELERI buradan gelmez — onlar ekran goruntusu kanalindan
  # geliyor. Boylece Binance hesabina okuma yetkisi veren hicbir sir
  # saklanmiyor.
  # --- ALPHA VANTAGE ----------------------------------------------------
  # ANAHTAR GEREKIR (.env -> ALPHA_VANTAGE_API_KEY). Ucretsiz katman:
  # GUNDE 25 istek + SANIYEDE 1 istek (ikisi de 2026-08-15'te olculdu).
  #
  # MCP SUNUCUSU OLARAK BAGLANMADI, bilerek: sohbet ajani tek soruda 12
  # arac cagirabiliyor, gunluk kota iki turda biterdi. Zamanlanmis
  # collector olarak ayni kota fazlasiyla yetiyor (~10 istek/gun).
  # --- TIINGO (YEDEK, VARSAYILAN KAPALI) --------------------------------
  # Olculdu (2026-08-15): Euronext Amsterdam KAPSAMI YOK — `ASML` cagrisi
  # Nasdaq ADR'sini donduruyor, `ASML.AS` 404. Haber API'si ucretsiz
  # katmanda kapali ("You do not have permission").
  # Geriye kalan tek faydasi FX; onu da Alpha Vantage veriyor.
  # Bu yuzden yalnizca AV kotasi dolarsa FX yedegi olarak aciliyor.
  bist:
    - THYAO
    - ASELS
    - GARAN
    - AKBNK
    - TUPRS
    - SISE
    - EREGL
    - KCHOL
    - BIMAS
    - FROTO
  # BUX'ta takip edilen ETF/hisse sembolleri (login sonrasi doldur)
  bux:
    - VWCE
    - IWDA
    - CSPX

sources:
  # KRIPTO EVRENI. Analiz edilecek coin listesini piyasa degeri
  # siralamasindan kurar — hissedeki endeks uyeliginin karsiligi.
  kriptoevren:
    enabled: true
    requires_login: false
    top_n: 100
    # ALINABILIR coin icin MUTLAK hacim: soru "emri gecirebilir miyim".
    min_volume_usd: 5000000
    # REFERANS coin icin DEVIR HIZI: emir yok, soru "bu fiyat gercek mi".
    # Piyasa degerleri uc buyukluk mertebesine yayildigi icin mutlak esik
    # yanlis olcer — LEO 8,6 mlr $ ama gunde %0,006 doner.
    min_turnover_pct: 0.10

  # Binance'te LISTELENMEYEN referans coin'lerin gunluk serisi.
  cgfiyat:
    enabled: true
    requires_login: false
    days: 365               # ucretsiz katman tavani (1095 -> HTTP 401)
    # Gercek maliyet hiz siniri: 21 coin tam cekim 5 dk 56 sn surdu ve
    # neredeyse tamami bekleme. Tur basina kota + en bayat once.
    max_per_run: 10

  kripto:
    # Sembol -> (Binance cifti, CoinGecko coin'i) kimlik cozumu.
    # DIGER IKISININ ON KOSULU: kimlik dogrulanmadan veri cekilmez.
    enabled: true
    requires_login: false
  binance:
    enabled: true
    requires_login: false
    daily_bars: 1100        # ~3 yil (endTime ile sayfalanir)
    hourly_bars: 720        # 30 gun
  coingecko:
    # Kriptonun "temel veri" karsiligi: piyasa degeri, arz, FDV, ATH.
    # DIKKAT: bunlar isletme performansi DEGIL, tokenomiktir. Coin'in
    # cirosu/kari olmadigi icin F/K, marj, ROE TANIMSIZDIR.
    enabled: true
    requires_login: false

  alphavantage:
    enabled: true
    requires_login: false
    daily_budget: 20        # 25'lik kotanin altinda emniyet payi
    fx_pairs:
      - ["EUR", "USD"]      # BUX portfoyu EUR, fiyat serileri USD
      - ["USD", "TRY"]      # Midas icin hazir
    # Piyasa vekilleri: ham endeks sembolleri AV'de calismiyor (^NDX bos
    # doner), endeksi takip eden ETF'ler kullaniliyor. Olay calismasindaki
    # piyasa modelinin (alfa/beta) girdisi bunlar.
    indices: ["QQQ", "IAEX"]
    eu_per_run: 4           # her calismada kac Amsterdam kotasyonu
    overview_per_run: 3     # her calismada kac hisse sayisi (donusumlu)
    # Kripto haberinde SEMBOL BASINA tek istek: AV'de coklu ticker VE
    # anlaminda ve birlikte gonderilince 0 sonuc donuyor (olculdu).
    news_per_run: 2         # donusumlu; en bayat olanlar oncelikli

  tiingo:
    enabled: false
    requires_login: false
    fx_pairs: ["eurusd", "usdtry"]
    fx_days: 90

  midasbilanco:
    # BIST bilancosu + gelir tablosu. TARAYICI gerektiriyor: satir adlari
    # HTML'de ama degerler JS ile geliyor.
    # DONUSUMLU: bilanco CEYREKTE BIR degisir, her gun 100 sembol cekmek
    # ~17 dk eder ve nabzin butcesini yer. 10'ar sembolle BIST 100 ~10
    # gunde tamamlanir — ceyreklik veri icin fazlasiyla sik.
    enabled: true
    requires_login: false
    per_run: 10

  isyatirim:
    enabled: true
    requires_login: false
    # Is Yatirim'in acik veri ucu - BIST fiyat/tarihsel seri icin ana kaynak
    base_url: "https://www.isyatirim.com.tr"
    # Tarihsel seri cekilecek endeks bilesenleri. Uyelik listesi Midas'in
    # public sayfalarindan geliyor (`collect --site midas`), yani burayi
    # elle guncellemeye gerek yok. BIST 100 de yazilabilir ama 100 istek
    # eder; trend analizi icin BIST 30 fazlasiyla yeterli.
    indices: ["BIST 100"]

    # SURE BUTCESI (saniye). Dolunca collector DUZGUNCE durur ve
    # `partial` doner; kalan sembolleri bir sonraki kosu alir (siralama
    # en bayat once, yani kesilen kuyruk her kosuda degisir).
    #
    # NEDEN VAR: `run_hafif.sh` butcesi 20 dk ve asildiginda SUREC
    # GRUBUNU olduruyor. 2026-08-17'de ogle kosusu tam olarak boyle
    # kayboldu — collect 20 dk'yi doldurdu, `nabiz` adimina HIC
    # ulasilamadi, o gun sinyal/tez/risk kontrolu yapilmadi.
    # 780 sn = 13 dk: kalan ~7 dk midas+prices+makro+takvim+kap ve
    # nabiz adimi icin. Olculdu 2026-08-18: 338 sembol ~23,5 dk
    # (medyan istek 0,61 sn ama %29'u ~12 sn'ye takiliyor).
    #
    # KAPSAM IKI KOSUYA YAYILIYOR, kaybolmuyor: canlida olculdu, 780 sn
    # 213/338 sembol cekiyor. Ogle 18:00 en bayat 213'u alir; 22:15
    # nabzi (ayni collector, 45 dk'lik kabuk butcesi) o an en bayat olan
    # kalan 125'i ONCE alir. Yani her sembol gunde en az bir kez
    # taze. Tek sayi bilerek: ikinci bir butce degeri surukleme yuzeyi
    # olurdu ve bu projenin tekrar eden kusur sinifi tam olarak odur.
    azami_sure_sn: 780

    # Tarayici fallback'i basina UST SINIR (saniye). Sinirsizken tek bir
    # sembol dakikalarca asilabiliyordu (Playwright varsayilani gezinme
    # ve evaluate icin AYRI 30 sn, ustelik evaluate icindeki `fetch`
    # hicbir zaman asimina tabi degil). Bir sembolu kacirmak, kosuyu
    # kaybetmekten ucuzdur.
    fallback_sn: 30
    # LIKIDITE ESIGI (gunluk TL hacim). Katalogdaki 729 BIST kagidinin
    # cogu gunde birkac islem goruyor. Olculdu (2026-08-16): medyan 33M,
    # 50M esigi 247 kagit birakiyor — piyasanin daha likit yarisi.
    # 0 yapilirsa suzgec kapanir ve hepsi taranir (200-400 sinyal, gurultu).
    min_hacim_tl: 50000000
    # ASGARI BAR — bunun altindaki sembol ARTIMLI degil TAM cekilir.
    # Ilk cekim zaten tam yapiliyor; ama o cekim yarim kalirsa (sure
    # butcesi kesti, gecici hata) sembol sonsuza kadar artimli kalir ve
    # bosluk hic dolmaz. Maliyeti ayni: tek istek, yalnizca yanit buyur.
    # 200: analysis.lookback_days (250) islem gunune dustugunde kabaca
    # bu ediyor.
    # NOT: dusuk bar sayisi TEK BASINA ariza degil. MASFN (19 bar) ve
    # QUICK (14 bar) ilk teshiste buna kanit sayilmisti, YANLISTI —
    # ikisi de 2026 Temmuz/Agustos'ta ISLEM GORMEYE BASLAMIS kagitlar,
    # Yahoo'dan `max` ile de 15 ve 11 bar geliyor.
    asgari_bar: 200
  # BIST DERIN GECMISI (Yahoo `.IS`) — backtest'in on kosulu.
  # `isyatirim` BIST'in birincil kaynagi ve oyle kaliyor (hisse sayisi,
  # gunluk hacim, XU100 sadece orada). Ama derinligi 13,5 ay: TEK makro
  # rejim. Strateji sinamak icin en az IKI rejim gerekir.
  bistgecmis:
    enabled: true
    requires_login: false
    # 10 yil BILEREK, `max` degil. Olculdu 2026-08-20: `max` 365
    # sembolde ~1,55 milyon bar getiriyor (DEVA 2000'e kadar) ve
    # veritabanini kat kat sisiriyor. 10 yil dort ayri rejimi kapsiyor
    # — 2018 TL krizi, 2020 COVID, 2021-22 enflasyon/faiz dongusu,
    # 2023-24 normallesme — yani amaci FAZLASIYLA karsiliyor.
    period: "10y"
    # GECMISI ZATEN DOLU sembolde her gece kullanilan kisa pencere.
    # Derin gecmis degismiyor, yalnizca son bar ekleniyor: ilk kosu
    # 595.713 bar / 87 sn, gunluk tazeleme bunun kucuk bir kesri.
    # 5 gun: hafta sonu + tatil boslugu icin pay.
    gunluk_period: "5d"
    # Tek `download` cagrisindaki sembol sayisi. 120: olculen 60'lik
    # parca 4,3 sn surdu, iki katina cikarmak istek sayisini yariya
    # indiriyor ve Yahoo tarafinda sorun cikarmadi.
    parca: 120
    # Yahoo'nun TASIMADIGI sembol orani bu esigi asarsa `partial` doner.
    # Altinda kalirsa nota yazilir ama alarm uretmez: DMLKTG gercek bir
    # BIST kodu (Midas'ta bari var) ama `DMLKTG.IS` Yahoo'da yok — tek
    # bir kod yuzunden her kosuda partial donmek, bugun dort collector'da
    # kapatilan SAHTE ALARM sinifini yeniden acardi. Esigin asilmasi ise
    # "birkac kod" degil yapisal bir sorundur (sonek degisti, BIST
    # kapsamdan cikti) ve o zaman gercekten soylenmeli.
    azami_kayip_orani: 0.10
    # KIYAS ENDEKSLERI — backtest'in piyasa etkisini ayiklamasi icin.
    # XU100 isyatirim'den yalnizca 287 bar (13,5 ay) geliyor; hisseler
    # 10 yillikken kiyas sig kalirsa "sinyal kazandirdi" ile "BIST
    # yukseldi" ayirt edilemez. Yahoo ayni derinligi veriyor (2.495 bar).
    endeksler:
      XU100: { yahoo: "XU100.IS", ad: "BIST 100" }
      XU030: { yahoo: "XU030.IS", ad: "BIST 30" }
  kap:
    enabled: true
    requires_login: false
    base_url: "https://www.kap.org.tr"
    lookback_days: 3
  # BUX ve Midas MOBIL-ONLY: web arayuzleri yok, login'li kazima imkansiz.
  # Pozisyonlar Telegram ekran goruntusu kanalindan geliyor (`run.py bot`).
  bux:
    enabled: true          # yalnizca PUBLIC ETF/ETC katalogunu ceker
    requires_login: false
    base_url: "https://bux.com"
  midas:
    detay_per_run: 6        # her kosuda kac hisse detay sayfasi (donusumlu)
    # PORTFOY hala ekran goruntusunden (web arayuzu yok, dogrulandi).
    # Ama PIYASA VERISI public: getmidas.com/canli-borsa/ altinda giris
    # gerektirmeyen, sunucu tarafinda uretilmis tablolar var (~626 hisse,
    # BIST 100/50/30 bilesenleri) ve JavaScript bile gerekmiyor.
    # 15 dakika gecikmeli — sayfada yaziyor. Gunluk kapanis icin sorun
    # degil ama SEANS ACIKKEN kapanis yazilmiyor (bkz. collector).
    enabled: true
    requires_login: false
    base_url: "https://www.getmidas.com"
  bist:
    # BIST sirket katalogu (kod + tam unvan) KAP'tan cekilir. Isim sart:
    # haber eslestirmesi ve sohbet katmanindaki enstruman tespiti ada bakar.
    enabled: true
    requires_login: false
  edgar:
    # SEC EDGAR — ABD'de kote sirketlerin resmi dosyalamalari (KADEME 1).
    # Yalnizca ADIYLA DOGRULANMIS kimlikler taranir; ticker tahminine guvenilmez.
    enabled: true
    requires_login: false
    lookback_days: 30
  indices:
    # BUX "Discover" ekraninin endeks filtreleri. Bilesenler public listeden
    # alinir; Wikipedia burada yalnizca KESIF tohumudur, kanit degildir —
    # her sirket ayrica SEC ticker/CIK dosyasina karsi dogrulanir.
    # KAPSAM: yalnizca BUX'un Discover ekraninda cip olarak gorunen endeksler.
    # FTSE MIB / SMI / OMX / FTSE 100 kaynaklari da calisiyor ama BILEREK
    # eklenmedi: BUX bu endeksleri sunmuyor, eklenirse katalog satin
    # alinamayacak isimlerle (Ferrari, Nestle, Novo Nordisk...) dolardi.
    #
    # Nasdaq-100 icin kaynak farkli: Wikipedia'daki bilesen tablosu
    # kaldirilmis, Invesco QQQ dosyasi bos donuyor, iShares ajax uclari bayat.
    # stockanalysis.com sunucu tarafinda tam tabloyu veriyor. Ucuncu taraf
    # ama rolu Wikipedia ile ayni: sadece KESIF tohumu — her isim SEC'in
    # resmi ticker/CIK dosyasina karsi dogrulanir ve raporda asla kaynak
    # olarak gosterilmez.
    enabled: true
    requires_login: false
    list:
      - { name: "S&P 500", expect: 503, url: "https://en.wikipedia.org/wiki/List_of_S%26P_500_companies" }
      - { name: "Nasdaq 100", expect: 101, url: "https://stockanalysis.com/list/nasdaq-100-stocks/" }
      - { name: "AEX",     expect: 25,  url: "https://en.wikipedia.org/wiki/AEX_index" }
      - { name: "BEL 20",  expect: 20,  url: "https://en.wikipedia.org/wiki/BEL20",   suffix: ".BR" }
      - { name: "CAC 40",  expect: 40,  url: "https://en.wikipedia.org/wiki/CAC_40" }
      - { name: "IBEX 35", expect: 35,  url: "https://en.wikipedia.org/wiki/IBEX_35" }
      - { name: "DAX",     expect: 40,  url: "https://en.wikipedia.org/wiki/DAX" }
  xbrl:
    # SEC XBRL companyfacts — sirketin KENDI dosyaladigi yapisal finansallar.
    # edgar.py dosyalamanin varligini getiriyor, bu modul ICERIGINI.
    enabled: true
    requires_login: false
  prices:
    # Piyasa vekilleri — olay calismasindaki alfa/beta modelinin girdisi.
    indices: ["QQQ", "AEX"]
    # OHLCV — teknik analizin on kosulu. Tarayici uzerinden cekilir:
    # ayni uc nokta httpx ile 429, tarayicidan 200 donuyor (cerez/baslik
    # meselesi). KULLANICI GIRISI GEREKMIYOR — dogrulandi.
    enabled: true
    requires_login: false
    range: "2y"
    # YEREL BORSA KOTASYONU — pozisyonun para birimindeki seri.
    #
    # `fiyat_kaynagi()` pozisyonun para birimiyle eslesen kaynagi seciyor
    # ve EUR serisi Alpha Vantage'dan geliyordu. AV'nin ucretsiz kotasi
    # (gunde 25) her gece tukeniyor: 2026-08-17'de ASML'nin EUR serisi
    # 14 Agustos'ta kalmisti, yani portfoyun %41'inin GUNLUK HAREKETI
    # raporda hic gorunmuyordu. Yahoo ayni kotasyonu kotasiz veriyor.
    #
    # Sonek eklemek bir TAHMINDIR; collector para birimi VE sirket adi
    # eslesmesini ayrica dogruluyor, tutmayan seriyi YAZMIYOR.
    borsa_sonekleri:
      EUR: ".AS"       # Euronext Amsterdam (BUX'un ana borsasi)
  makro:
    # MAKRO / KAPANIS PANELI — endeks, emtia, kur, faiz, VIX.
    #
    # Gun sonu raporunda dunya/Turkiye gundemi ve emtia yoktu; sebebi
    # prompt degil VERIYDI: `INDEX` altinda yalnizca UC enstruman vardi
    # (QQQ, AEX, XU100). Altin, gumus, petrol, DXY, VIX hicbiri yoktu.
    #
    # Semboller 2026-08-17'de GERCEK CAGRIYLA dogrulandi. Spot altin/gumus
    # icin `XAUUSD=X` / `XAGUSD=X` Yahoo'da YOK; vadeli (`GC=F`, `SI=F`)
    # calisiyor. Gram altin bu yuzden spot vekilinden (PAXG) turetiliyor —
    # vadeli ile spot arasinda olculen fark %2,4 ve gram hesabini bozar.
    enabled: true
    requires_login: false
    # Cagri sayisini DEGISTIRMEZ, yalnizca ilk yazma hacmini: enstruman
    # basina tek istek. "2y" yapilirsa SMA200 ve rejim analizi de acilir.
    range: "1y"
    # Bos birakilirsa collectors/makro.py:PANEL'in tamami cekilir.
    # Buraya yazmak = paneli daraltmak.
    panel:
      - SPX
      - NDX
      - DAX
      - SX5E
      - ALTIN_VADELI
      - GUMUS
      - BRENT
      - WTI
      - BAKIR
      - TTF
      - USDTRY
      - EURTRY
      - EURUSD
      - DXY
      - US10Y
      - VIX
  takvim:
    # EKONOMIK TAKVIM. Calisan kaynaklar: Fed FOMC + TCMB yayin takvimi.
    # TUIK (kendi API'si 403) ve BLS (403) HER KOSUDA yeniden yoklanir;
    # acildiklari gun `takvim_kaynak` tablosunda gorunur.
    enabled: true
    requires_login: false
    # Rapordaki "Yarin Ne Var" bolumunun ileri bakis penceresi.
    # 14 gun COK DAR: FOMC yilda 8, PPK yilda 8 kez toplaniyor, yani bolum
    # gunlerce bos kalir ve "onemli bir sey yok" gibi okunur. 30 gun bir
    # sonraki faiz kararini her zaman kapsiyor.
    pencere_gun: 30
  tuik:
    # TUIK SDMX — Turkiye makro gosterge katmani.
    # ANAHTAR: .env -> TUIK_API_KEY (Veri Portali > Kullanici Bilgileri >
    # SMS dogrulamasi ile uretilir). SIFRE DEGIL: iptal edilebilir,
    # kapsami sinirli ve resmi/dokumante erisim yolu.
    #
    # OLCULDU (2026-08-18): 408 veri akisi erisilebilir. TUFE SDMX'te
    # YOK — 408 akisin hicbirinde, TR ve EN adlarda sifir eslesme.
    # Elimizdeki en yakin tuketici enflasyonu oncusu Yi-UFE.
    # Yayin takvimi de bu token'la acilmiyor (portal API ayri katman).
    enabled: true
    requires_login: false
    # ISTEK BASINA zaman asimi. 300 -> 90 (2026-08-19).
    #
    # 300 degeri TAM GECMISLI sorgular icin secilmisti; `son_gozlem: 240`
    # o sorgulari ortadan kaldirdi ve saglikli yanit artik 1,7-3 sn
    # (settings'teki olcum + 18 Agu kosusu 3,4 sn). 90 sn, olculen en
    # yavas saglikli yanitin 30 katindan fazla pay birakiyor; asan sey
    # yavaslik degil ERISILEMEZLIKTIR ve onu beklemenin degeri yok.
    timeout_sn: 90
    # COLLECTOR'UN TOPLAM SURE BUTCESI — `isyatirim.azami_sure_sn` ile
    # ayni kalip. OLCULEN ARIZA: 2026-08-19 22:15 nabzinda TUIK dort kez
    # zaman asimina girdi ve 1225,9 sn (20,4 dk) surdu; gecelik zincirin
    # 45 dk'lik kabuk butcesinin %45'ini tek basina yedi, panel 33
    # saniye yasadi ve SIGTERM ile olduruldu — o gece bildirim GITMEDI.
    # Butce dolunca collector `partial` doner, kesilen seriyi ADIYLA
    # raporlar ve kosunun geri kalani calisir. 0 yapilirsa koruma kapanir.
    azami_sure_sn: 300
    # ARTIMLI CEKIM YOK: her sorgu tam gecmisi donduruyor (Yi-UFE'de 535
    # gozlem, 1982'den beri) ve uc seri 10 dakikadan uzun surdu. TUIK
    # AYLIK yayin yaptigi icin gunluk tekrar cekim bosuna; bu suredeki
    # kayitlar atlanir. 0 yapilirsa koruma kapanir.
    tazelik_saat: 24
    # SINIRSIZ GECMIS SORGUSU SUNUCUYU BOGUYOR: ekonomik guven endeksinde
    # tam gecmis 90 sn'de bile donmedi, lastNObservations=240 ile 1,7
    # saniyede dondu. 240 aylik gozlem = 20 yil, gunluk rapor icin fazlasi
    # gereksiz. Seri bazinda `son_gozlem` ile ezilebilir.
    son_gozlem: 240
    # SERI SECIMI. `sec` BOYUT ADIYLA yaziliyor, pozisyonla degil —
    # SDMX anahtarindaki nokta sirasini kod DSD'den uretiyor. Yi-UFE'de
    # 11 boyut var ve bir noktayi eksik yazmak 404 uretiyor.
    seriler:
      - kod: TR_YIUFE_YILLIK
        ad: "Yi-UFE yillik degisim"
        birim: "%"
        dataflow: DF_YIUFE_EDO_V1
        not: "URETICI enflasyonu. TUFE degil — TUIK tuketici endeksini
              SDMX'ten yayinlamiyor. Tuketici enflasyonunun ONCU
              gostergesi sayilir, yerine gecmez."
        sec:
          DEGISIM: "4"                  # bir onceki yilin ayni ayina gore %
          URUN_UFE_NACE_CPA: "B-E36"    # toplam sanayi kapsami
          FAAL_GRUP: "_T"
      - kod: TR_ISSIZLIK
        ad: "Issizlik orani (15+, mevsim duzeltilmis)"
        birim: "%"
        dataflow: DF_ISGUCU_AYLIK_TEMEL_ISGUCU_C
        sec:
          ISGUCU_GOSTERGE: "8"          # issizlik orani (dogrulandi: 2688/35420)
          TEMEL_YAS: "Y_GE15"
          SEASONAL_ADJUST: "S"
          SEX: "_T"
      - kod: TR_EKONOMIK_GUVEN
        ad: "Ekonomik guven endeksi"
        birim: "endeks"
        dataflow: DF_EKONOMIK_GUVEN_SDMX_C
        not: "100'un ustu iyimser, alti kotumser."
        sec:
          ENDEKS_DEGISIM: "1"           # endeks (2 = degisim orani)
  stocknews:
    # Enstruman bazli basin taramasi (KADEME 2/3). Anahtar sirket ADI'dir,
    # ticker degil: "NOW"/"ING" gibi semboller gundelik kelimelerle cakisiyor.
    enabled: true
    requires_login: false
    lookback_days: 7
    max_per_instrument: 25
  news:
    enabled: true
    requires_login: false
    max_items_per_feed: 25
    # BAYATLIK ESIGI (gun). Bir akisin EN YENI girdisi bu kadar gunden
    # eskiyse collector `partial` doner ve bekci Ali'ye bildirir.
    # NEDEN VAR: HTTP 200 "veri taze" demek degil. 2026-08-20'de UC
    # akis ayni anda 200 donerken oluydu — WSJ 19 AY (son haber Ocak
    # 2025), BloombergHT 14 gun, Hurriyet 2,5 ay. Ucu de "basarili"
    # sayiliyordu. 3 gun: hafta sonu bosluguna dayanir, gercek olumu
    # ertesi is gunu yakalar.
    bayatlik_gun: 3
    feeds:
      - { name: "Investing TR - Hisse",  url: "https://tr.investing.com/rss/stock.rss",        type: rss }
      - { name: "Investing TR - Ekonomi",url: "https://tr.investing.com/rss/news_14.rss",      type: rss }
      # BLOOMBERGHT RSS'I TERK ETMIS — KAZINIYOR.
      # Olculdu 2026-08-20: `/rss` ucu HTTP 200 ve 20 girdi donuyor ama
      # en yenisi 6 Agustos (14 gun). Sitede hicbir application/rss+xml
      # etiketi yok; denenen bes alternatif yol (/borsa/rss, /ekonomi/rss,
      # /piyasalar/rss, /haberler/rss, /feed) HEPSI 404. Akis olmus, ucu
      # unutulmus halde ayakta.
      # Kademe 2 bir Turkce kaynak ve elimizde yalnizca iki tane var
      # (AA, Ekonomim) — dusurmek yerine JSON-LD'sinden toplaniyor.
      # Tarayici GEREKMIYOR: sayfa duz HTML, ItemList + NewsArticle.
      - { name: "BloombergHT",           url: "https://www.bloomberght.com/",                  type: jsonld }
      # Mynet (403) ve Reuters agency (404) feed'leri kapandi.
      # Asagidakiler 2026-08-14'te tek tek dogrulandi.
      # Not: dunya.com/rss kategori parametresini yok sayip genel akisi
      # donduruyor (spor/siyaset karisiyor) -> yerine ekonomim.com kullaniliyor.
      - { name: "Investing TR - Piyasa", url: "https://tr.investing.com/rss/market_overview.rss", type: rss }
      - { name: "Ekonomim (Dunya)",      url: "https://www.ekonomim.com/rss?ekonomi",           type: rss }
      - { name: "AA - Ekonomi",          url: "https://www.aa.com.tr/tr/rss/default?cat=ekonomi", type: rss }
      # WSJ 19 AY BOYUNCA OLU AKIS DONDURDU — kimse fark etmedi.
      # Olculdu 2026-08-20: eski adres (feeds.a.dj.com) HTTP 200 ve 20
      # girdi donuyordu ama en yenisi 27 OCAK 2025'ti. Veritabaninda da
      # WSJ'den tam 20 haber vardi, hepsi o tarihten. Dow Jones akisi
      # yeni sunucuya tasimis, eskisi donmus halde ayakta kalmis.
      # Yeni adres ayni gun olculdu: 61 girdi, en yenisi AYNI GUN.
      # Bu vaka `bayatlik_gun` bekcisinin var olma sebebi.
      - { name: "WSJ Markets",           url: "https://feeds.content.dowjones.io/public/rss/RSSMarketsMain", type: rss }
      # 2026-08-18'de EKLENENLER — hepsi gercek cagriyla olculdu.
      #
      # Ali "Bugunun Turkiye ekonomisinde ne oldu" diye sordu ve bot
      # "makro haber akisim yok" dedi. Akis VARDI ama iki eksik vardi:
      # okuyan arac (`gundem` eklendi) ve KAPSAM.
      #
      # Kuresel taraf yalnizca WSJ'ye bagliydi; iki kademe-2 kaynak daha.
      - { name: "CNBC Markets",          url: "https://www.cnbc.com/id/10001147/device/rss/rss.html", type: rss }
      - { name: "MarketWatch",           url: "https://www.marketwatch.com/rss/topstories", type: rss }
      # ELENENLER ve NEDENI (bir dahaki turda yeniden denenmesin):
      #   Investing "En Populer" (news_285) -> icerigi CAZIPTI (TL, Brent,
      #       Fed, BTC tek akista ve Turkce) ama Investing.com bir
      #       TOPLAYICI ve kaynak disiplininde KADEME 3 = KANIT DEGIL.
      #       `gundem` araci kademe 1-2 suzdugu icin hic gorunmezdi.
      #       Cazip icerik ugruna kademe kuralini esnetmek, tum kaynak
      #       hiyerarsisini anlamsizlastirirdi. EKLENDI, SONRA GERI ALINDI.
      #   TCMB RSS          -> 404, RSS servisi YOK (duyuru sayfasi HTML)
      #   Hazine/Maliye RSS -> 200 ama 0 item
      #   Reuters, AP       -> 404 / baglanti yok
      #   FT                -> 200 ama tek item (kesilmis akis)
      #   dunya.com/rss     -> 25 item ama spor/siyaset karisik ve
      #                        ekonomim.com zaten Dunya'nin ekonomi masasi
      #   paraanaliz.com    -> 404

analysis:
  lookback_days: 250
  indicators:
    sma: [20, 50, 200]
    ema: [12, 26]
    rsi_period: 14
  vision:
    # Ekran goruntusu kac kez BAGIMSIZ okunsun? 2 = capraz dogrulama.
    # 1'e dusurmek hizlandirir ama satir kaymasi hatalarini yakalayamaz:
    # gercek ornekte model bir ETF'in +42.42'sini alt satirdan +33.07 diye
    # kopyaladi ve bunu ancak ikinci okuma yakalayabilirdi.
    passes: 2

  llm:
    # Ajan dongusu sinirlari. Kodda varsayilanlari var; buraya YAZILDI
    # ki ayarlanabilir gorunen her deger GERCEKTEN ayarlanabilir olsun.
    # SOHBET AJANI TUR SINIRI. 24'ten 40'a cikarildi (2026-08-18).
    # OLCUM: her arac cagrisi bir tur. E2E kosumunda GECEN en agir
    # senaryo 20 arac kullandi (haber + kaynak kademesi), Izmir konut
    # sorusu da 20 — yani mesru bir soru butcenin %83'unu yiyordu.
    # Ve 18 Agu 07:41'de canlida bir tur `Reached maximum number of
    # turns (24)` ile DUSTU: kullanici, botun 24 tur boyunca topladigi
    # her seyi kaybetti. 40, olculen en agir sorunun iki kati pay birakir.
    # Ust sinir tur sayisi DEGIL sure: olculen en uzun BASARILI tur 206
    # sn, `telegram.is_zaman_asimi_dk: 15`'in cok altinda.
    chat_max_turns: 40
    panel_max_turns: 16       # panel ajani tur siniri
    max_buffer_mb: 64         # SDK JSON tamponu (goruntu okurken 1 MB asiliyordu)
    collect_timeout_sn: 300   # `veri_topla` alt sureci
    enabled: true
    # LLM kimlik yolu — MALIYETI BELIRLEYEN AYAR:
    #   abonelik : Claude Max/Pro aboneligi (claude.ai girisi) uzerinden.
    #              Token basina ucret YOK; abonelik kullanim limitlerinden duser.
    #   api_key  : .env'deki ANTHROPIC_API_KEY, token basina faturalanir.
    #
    # Neden ayar gerekiyor: Claude Code CLI once ANTHROPIC_API_KEY'e bakar ve
    # varsa aboneligi HIC kullanmaz. "abonelik" secilince anahtar surec
    # ortamindan silinir (bosaltmak yetmiyor) — bkz. config.py.
    auth: abonelik
    # BFF mimarisi: Opus = makro strateji/sentez, Fable = hizli taktik islem
    strategist_model: "claude-opus-5"
    tactical_model: "claude-fable-5"
    max_news_items_in_prompt: 40
    max_disclosures_in_prompt: 30
    # Gundem kovalarinin geriye bakis penceresi. 7 gun COK GENIS bir GUN
    # SONU raporu icin: dun kapanan bir gundem maddesi bugunun notunda
    # "bugun oldu" gibi durur. 3 gun hafta sonu boslugunu da kapsar.
    haber_gun: 3
    # WEB ARAMASI. Ali'nin gerekcesi: haberi ogren, sonra o haberin
    # enstrumanlari hakkinda sor. Once reddedilmisti ("kademesiz kaynak
    # getirir") ama gerekce fazla katiydi: kademe INTAKE'te degil
    # SINIFLANDIRMADA uygulaniyor ve `kaynak_kademesi` araci alan adindan
    # kademeyi MEKANIK olarak cikariyor.
    # Kapatmak icin false: model WebSearch/WebFetch cagirdiginda izin
    # kapisinda reddedilir (sessizce yok sayilmaz, modele hata doner).
    web_arama: true

report:
  output_dir: "reports"
  formats: [markdown, html]
  title: "Gunluk Piyasa & Portfoy Analizi"

arama:
  # Sohbet arsivi arama katmani (M4). Iki yontem, tek siralama:
  #   leksik  — FTS5 trigram, `sohbet_fts` (sema)
  #   gomme   — embeddinggemma, yerel Ollama
  # Ikisi RRF ile birlestiriliyor.
  gomme:
    # TAMAMEN YEREL, ses katmani gibi: sohbet metni hicbir servise
    # gitmez. Ollama ayri bir ikili — bu makinede `torch` ve
    # `onnxruntime` icin Python 3.14 / x86_64 wheel'i YOK, yani
    # `sentence-transformers` yolu kapali.
    #
    # `ollama pull embeddinggemma` (621 MB) ve `ollama serve` gerekli.
    # OLCULDU 2026-08-20: ollama 0.7.0 bu modeli CALISTIRAMIYOR
    # ("this model does not support embeddings"); destek v0.11.10'da
    # geldi. Asgari surum bir dilek degil, olculmus kosul.
    #
    # KAPALI — KARAR OLCUME DAYANIYOR (M4/T7, 2026-08-20).
    # Gorev belgesinin kurali: "hibrit, FTS5'e gore `kelime_yok`
    # kategorisinde belirgin kazanc saglamiyorsa gomme katmani canliya
    # alinmaz". Olculdu, recall@3:
    #
    #                 tam_kelime  parafraz  kelime_yok    MRR   gecikme
    #   FTS5 trigram      100%       80%        20%      0.576    7 ms
    #   embeddinggemma    100%       40%        50%      0.516  196 ms
    #   Hibrit RRF        100%       60%        20%      0.604  196 ms
    #
    # Hibridin `kelime_yok`'u FTS5 ile AYNI (%20) — kazanc sifir.
    # Sebep teshis edildi: o kategoride FTS5 hedefi hic bulamiyor ama
    # BASKA satirlar donduruyor; RRF onlara 1/61, 1/62 veriyor ve
    # gommenin 1. siradaki DOGRU cevabi da 1/61 aliyor. Leksik tarafin
    # emin gorunen copu, anlam tarafinin dogru cevabini asagi itiyor
    # (kelime_yok_3: gomme 1. sira -> hibrit 3. sira).
    #
    # Gomme TEK BASINA `kelime_yok`'ta 2,5 kat iyi (%50). Yani kayip
    # modelde degil BIRLESTIRMEDE. Belge k ve agirlik ayarini ACIKCA
    # yasakliyor ("iyilesmiyorsa oynama, sonucu raporla"), o yuzden
    # oynanmadi. Kod, testleri ve olcumuyle duruyor; acmak icin once
    # birlestirme yontemi degismeli.
    enabled: false
    url: "http://localhost:11434"
    model: "embeddinggemma"
    # Model kartina GUVENILMEZ, olculur — ve olculdu: 768.
    # Bu sayi degisirse eski vektorler gecersizdir; `gomme_model`
    # alani tam bunun icin var.
    boyut: 768
    # Olculen gecikme: 68 ms/metin (4'luk batch, model yuklu),
    # ilk cagri 1823 ms (model yuklemesi dahil). 156 satirlik arsiv
    # tek seferde ~11 sn. Timeout o buyuklugun kat kat ustunde.
    timeout_sn: 120
    batch: 32

voice:
  # Sesli mesaj -> metin. TAMAMEN YEREL: ses hicbir servise gonderilmez,
  # ek API maliyeti yok. Claude API audio girdisi kabul etmedigi icin ayri
  # bir konusma-metin katmani gerekiyor.
  #   brew install whisper-cpp
  #   curl -L -o data/models/ggml-small.bin \
  #     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.bin
  # Not: faster-whisper/mlx-whisper bu makinede kurulamiyor (PyAV'in Python
  # 3.14 wheel'i yok; mlx yalnizca Apple Silicon). whisper.cpp native ikili.
  enabled: true
  binary: "whisper-cli"
  model_path: "data/models/ggml-small.bin"
  language: "tr"

telegram:
  enabled: true
  send_html_file: true      # HTML raporu dosya olarak da gonder
  max_message_chars: 3800   # Telegram limiti 4096; guvenli pay birakiyoruz

  # ES ZAMANLI IS SAYISI. Dinleyici agir isleri (sohbet, gorsel, ses,
  # onay, rapor) alt sureclere veriyor; bkz. src/finagent/bot/kuyruk.py.
  #
  # SOHBET BASINA HER ZAMAN TEK IS calisir — bu sayi SOHBETLER ARASI
  # paralelligi belirler. Iki sahip icin 2 yeterli: Ali ve Yuksel
  # birbirini beklemez. Yukseltmek es zamanli `claude` alt sureci
  # demektir (bellek + hiz siniri), dusurmek eski davranisa doner.
  worker_sayisi: 2

  # Bir is bu sureyi asarsa DURDURULUR ve kullaniciya soylenir.
  # Yeniden DENENMEZ: ayni is ayni sureyi yine alir (kuyruk.py sozlesme 4).
  # 15 dk bol: sohbetten cagrilan collector'lar zaten 300 sn ile sinirli.
  is_zaman_asimi_dk: 15
  # Dusen sohbet turu icin yeniden deneme hakki. SINIFA BAGLI: tur
  # butcesi tukendiginde ASLA denenmez (deterministik olarak ayni duvara
  # toslar), yalnizca gecici sinifta (SIGKILL, celiskili sonuc cercevesi)
  # denenir. E2E kosumunda gecici sinifta 5 dususun 3'u boyle kurtarildi.
  # 0 yazilirsa yeniden deneme kapanir.
  sohbet_yeniden_deneme: 1
  # SAHIP ESLEMESI — hem YETKILENDIRME hem YONLENDIRME.
  #
  #   chat_id -> sahip   gelen mesaj KIMIN ADINA islenecek
  #   sahip -> chat_id   nabiz/tez/hafif bildirimi KIME gidecek
  #
  # Ayri bir `bildirim_chat_ids` ayari ACILMADI: ikinci bir dogruluk
  # kaynagi olur ve suruklenir (bu projenin tekrar eden kusur sinifi).
  # Yonlendirme bu eslemeden TURETILIR.
  #
  # Esleme bossa .env'deki TELEGRAM_CHAT_ID tek sahip olarak kabul
  # edilir — tek kullanicili kurulum bozulmasin.
  #
  # `extra_chat_ids` KALDIRILDI; sahipler onun yerine geciyor. Yetkili
  # olmak artik "bir sahibe bagli olmak" demek.
  sahipler:
    "5643817523": ali
    "5835078281": yuksel

  # Ekranda gosterilen ad. Yukaridaki anahtar VERITABANI anahtaridir ve
  # ASCII/kucuk harf olmak zorunda; burasi yalnizca HITAP icin. Eksik
  # birakilirsa anahtarin bas harfi buyutulur ("yuksel" -> "Yuksel").
  # Yetkilendirme ve yonlendirme buradan TURETILMEZ — bu satirlarin
  # silinmesi hicbir seyi bozmaz.
  gorunen_ad:
    yuksel: "Yüksel"

risk:
  # Guvenlik siniri: agent ASLA emir iletmez, sadece analiz uretir.
  allow_order_execution: false
  disclaimer: >
    Bu rapor otomatik olarak uretilmis bir bilgi derlemesidir; yatirim danismanligi degildir.
    Yatirim kararlari kullanicinin kendi sorumlulugundadir.
